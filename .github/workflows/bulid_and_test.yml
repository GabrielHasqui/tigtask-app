name: bulid and test

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Crear carpeta de reportes
        run: mkdir -p reportes

      - name: Comprobar sintaxis
        run: |
          set -o pipefail
          python -m compileall gestor_tareas tareas manage.py \
            2>&1 | tee reportes/sintaxis.txt

      - name: Validar configuración de Django
        run: |
          set -o pipefail
          python manage.py check \
            2>&1 | tee reportes/configuracion.txt

      - name: Ejecutar pruebas
        run: |
          set -o pipefail
          python manage.py test --verbosity 2 \
            2>&1 | tee reportes/pruebas.txt

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-ci-tigtask
          path: reportes/