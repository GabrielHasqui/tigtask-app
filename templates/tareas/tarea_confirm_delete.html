{% extends "base.html" %}

{% block title %}Eliminar tarea | TigTask{% endblock %}

{% block content %}
<div class="dialog-page">
    <section class="dialog-card" aria-labelledby="titulo-eliminar">
        <span class="danger-icon" aria-hidden="true"><i data-lucide="triangle-alert"></i></span>
        <p class="eyebrow">Confirmar acción</p>
        <h1 id="titulo-eliminar">¿Eliminar esta tarea?</h1>
        <p>Estás a punto de eliminar <strong>“{{ tarea.titulo }}”</strong>. Esta acción no se puede deshacer.</p>

        <form method="post">
            {% csrf_token %}
            <div class="dialog-actions">
                <a class="button button-ghost" href="{% url 'tareas:detalle' tarea.pk %}">Cancelar</a>
                <button class="button button-danger" type="submit">Sí, eliminar</button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
